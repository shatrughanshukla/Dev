<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <div class="bg-gray-700 p-8 rounded-lg shadow-black shadow-2xl max-w-sm w-full hover:-translate-y-0.5">
        <h2 class="text-center font-bold text-gray-200 text-3xl mb-6">Login</h2>
        <form>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-300 mb-2" for="email">Email</label>
                <input class="w-full px-3 py-2 bg-gray-600 border border-gray-500 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-gray-500" type="email" name="" placeholder="Email" id="email">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-300 mb-2" for="">Password</label>
                <input class="w-full px-3 py-2 bg-gray-600 border border-gray-500 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-gray-500" type="password" name="" placeholder="Enter your password here" id="">
            </div>
            <div>
                <button class="w-full bg-gray-800 py-2 rounded-xl hover:bg-gray-400 transition-colors duration-300 text-gray-200 hover:text-gray-900 font-bold shadow-black shadow-2xl hover:-translate-y-0.5" type="submit">Login</button>
            </div>
        </form>
    </div>
</body>
</html>
